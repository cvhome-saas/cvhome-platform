name: validate

# Validation only. Applies happen in CodeBuild — this workflow replaces
# cvhome-infra's trigger-apply.yml, which applied from Actions using static AWS keys
# and a project id derived differently from the one the bootstrap created.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TF_VERSION: "1.14.6"

jobs:
  # --- no AWS credentials needed below this line -------------------------------
  # These four run on every PR, including from forks.

  fmt:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive -diff

  validate:
    name: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - .
          - prereq
          - modules/ecs-service
          - modules/network
          - modules/store-core
          - modules/store-pod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      # -backend=false: validation must never need a state bucket or credentials.
      - run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}
      - run: terraform validate
        working-directory: ${{ matrix.dir }}

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - run: tflint --init
      - run: tflint --recursive --minimum-failure-severity=warning

  catalog-drift:
    name: catalog drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Which branch of the application to compare against.
      #
      # A new service and the catalog entry describing it are one change split across
      # two repositories, and they are normally developed on branches of the same name.
      # Comparing a feature branch here against the application's default branch would
      # report the new service as "in the catalog but not in common-config.yml" and
      # fail every build until both sides merged — so the same branch name wins when it
      # exists.
      #
      # Most platform work touches no service at all and has no counterpart branch, so
      # the fallback is the application's default branch. That is also what makes the
      # check meaningful on main: it asks whether released infrastructure matches
      # released application code.
      - name: Resolve the application branch
        id: app
        env:
          GH_TOKEN: ${{ secrets.APP_REPO_TOKEN }}
          APP_REPO: ${{ vars.APP_REPO || 'cvhome-saas/cvhome' }}
          # On a pull request, ref_name is the merge ref (123/merge), so the source
          # branch has to come from head_ref instead.
          CANDIDATE: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::APP_REPO_TOKEN is not available, so the catalog cannot be" \
                 "compared against $APP_REPO. This check does not pass vacuously:" \
                 "a catalog change that nothing verified is how four services ended" \
                 "up with no infrastructure."
            exit 1
          fi

          if gh api "repos/${APP_REPO}/branches/${CANDIDATE}" >/dev/null 2>&1; then
            ref="$CANDIDATE"
            why="matching branch"
          else
            ref="$(gh api "repos/${APP_REPO}" --jq .default_branch)"
            why="no branch named '${CANDIDATE}' in ${APP_REPO}; using its default"
          fi

          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "repo=${APP_REPO}" >> "$GITHUB_OUTPUT"
          echo "Comparing against ${APP_REPO}@${ref} (${why})"
          echo "Catalog compared against \`${APP_REPO}@${ref}\` — ${why}." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.app.outputs.repo }}
          ref: ${{ steps.app.outputs.ref }}
          path: .app
          token: ${{ secrets.APP_REPO_TOKEN }}

      - run: python3 scripts/check-catalog-drift.py --app-repo .app

  cloudformation:
    name: cloudformation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cfn-lint
      - run: cfn-lint bootstrap/bootstrap.yaml
      # Not continue-on-error: these rules are verified to fail on the exact defects
      # the legacy template shipped (PowerUserAccess, iam:*, an unversioned state
      # bucket, an echoing Stripe key). A soft failure here would defeat the point.
      - uses: aws-cloudformation/cloudformation-guard@v1
        with:
          rules: bootstrap/guard-rules
          data: bootstrap/bootstrap.yaml

  # --- the only job that touches AWS -------------------------------------------

  plan:
    name: plan (dev)
    runs-on: ubuntu-latest
    needs: [fmt, validate]
    # Forks have no access to the OIDC role, and a plan is not worth leaking one for.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write        # OIDC. No AWS_ACCESS_KEY_ID anywhere in this repo.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=env/dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - name: plan
        id: plan
        run: |
          terraform plan -input=false -lock=false \
            -var="project=${{ vars.PROJECT_ID }}" \
            -var-file=envs/dev.tfvars \
            -no-color 2>&1 | tail -c 60000 > plan.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### Terraform plan — dev\n\n```terraform\n' + plan + '\n```',
            });
