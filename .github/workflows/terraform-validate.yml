name: validate

# Validation only. Applies happen in CodeBuild — this workflow replaces
# cvhome-infra's trigger-apply.yml, which applied from Actions using static AWS keys
# and a project id derived differently from the one the bootstrap created.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TF_VERSION: "1.14.6"

jobs:
  # --- no AWS credentials needed below this line -------------------------------
  # These four run on every PR, including from forks.

  fmt:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive -diff

  validate:
    name: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - .
          - prereq
          - modules/ecs-service
          - modules/network
          - modules/store-core
          - modules/store-pod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      # -backend=false: validation must never need a state bucket or credentials.
      - run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}
      - run: terraform validate
        working-directory: ${{ matrix.dir }}

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - run: tflint --init
      - run: tflint --recursive --minimum-failure-severity=warning

  catalog-drift:
    name: catalog drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Which branch of the application to compare against.
      #
      # Both repositories now trunk on main: the application renamed develop to main,
      # so trunk maps to trunk by name. Off-trunk, the same branch name wins when it
      # exists, because a new service and the catalog entry describing it are one
      # change split across two repositories and are normally developed under one
      # name. Anything else falls back to the application trunk, which is the common
      # case: most platform work touches no service at all.
      #
      # Set the APP_REF repository variable to move the target if the application's
      # trunk ever moves again — a variable, not an edit here.
      - name: Resolve the application branch
        id: app
        env:
          # cvhome is public, so there is no secret to configure and nothing to log in
          # to. github.token is not a credential anyone creates: Actions injects it into
          # every run, and it can read any public repository.
          #
          # It is used rather than an unauthenticated call only for rate limits —
          # anonymous API requests are capped at 60/hour per IP, and GitHub-hosted
          # runners share addresses, so an anonymous check would fail intermittently
          # for reasons that have nothing to do with the catalog.
          GH_TOKEN: ${{ github.token }}
          APP_REPO: ${{ vars.APP_REPO || 'cvhome-saas/cvhome' }}
          # The application branch this repository's trunk targets.
          APP_TRUNK: ${{ vars.APP_REF || 'main' }}
          OUR_TRUNK: ${{ github.event.repository.default_branch }}
          # On a pull request, ref_name is the merge ref (123/merge), so the source
          # branch has to come from head_ref instead.
          CANDIDATE: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          # Fail loudly if the application repository cannot be read at all: renamed,
          # or no longer public. This check must never pass vacuously — a catalog change
          # that nothing verified is how four services ended up with no infrastructure.
          if ! default_branch="$(gh api "repos/${APP_REPO}" --jq .default_branch 2>/dev/null)"; then
            echo "::error::Cannot read ${APP_REPO}. If it is no longer public, give this" \
                 "workflow a token that can read it."
            exit 1
          fi

          # Ask whether a branch exists, and mean it. GitHub keeps a permanent redirect
          # from a renamed branch's old name, so the REST endpoint answers 200 with the
          # new branch for a name that no longer exists. git has no such redirect: it
          # fetches the literal refspec and fails. That gap is not hypothetical — it is
          # how a stale 'develop' passed this check and then broke the checkout below
          # after the application renamed develop to main. Comparing the name the API
          # echoes back against the one asked for closes it.
          has_branch() {
            [ "$(gh api "repos/${APP_REPO}/branches/$1" --jq .name 2>/dev/null)" = "$1" ]
          }

          if [ "$CANDIDATE" = "$OUR_TRUNK" ]; then
            ref="$APP_TRUNK"
            why="trunk maps to trunk (${OUR_TRUNK} -> ${APP_TRUNK})"
          elif has_branch "$CANDIDATE"; then
            ref="$CANDIDATE"
            why="matching branch"
          else
            ref="$APP_TRUNK"
            why="no branch named '${CANDIDATE}' in ${APP_REPO}; using the application trunk"
          fi

          if ! has_branch "$ref"; then
            echo "::error::${APP_REPO} has no branch '${ref}' — renamed or deleted?" \
                 "Set the APP_REF repository variable to the application branch this" \
                 "platform branch targets. Its default branch is '${default_branch}'."
            exit 1
          fi

          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "repo=${APP_REPO}" >> "$GITHUB_OUTPUT"
          echo "Comparing against ${APP_REPO}@${ref} (${why})"
          echo "Catalog compared against \`${APP_REPO}@${ref}\` — ${why}." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.app.outputs.repo }}
          ref: ${{ steps.app.outputs.ref }}
          path: .app
          # No token: checkout defaults to github.token, which reads public repos.

      - run: python3 scripts/check-catalog-drift.py --app-repo .app

  cloudformation:
    name: cloudformation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cfn-lint
      - run: cfn-lint bootstrap/bootstrap.yaml

      # The binary, pinned, rather than a marketplace action: there is no v1 tag on
      # aws-cloudformation/cloudformation-guard, so `uses: ...@v1` failed before the
      # job could start.
      #
      # Not continue-on-error: these rules are verified to fail on the exact defects
      # the legacy template shipped (PowerUserAccess, iam:*, an unversioned state
      # bucket, an echoing Stripe key). A soft failure here would defeat the point.
      - name: cfn-guard
        env:
          GUARD_VERSION: "3.2.1"
        run: |
          set -euo pipefail
          asset="cfn-guard-v3-x86_64-ubuntu-latest"
          curl -sSL -o guard.tar.gz \
            "https://github.com/aws-cloudformation/cloudformation-guard/releases/download/${GUARD_VERSION}/${asset}.tar.gz"
          tar xzf guard.tar.gz
          "./${asset}/cfn-guard" validate \
            --data bootstrap/bootstrap.yaml \
            --rules bootstrap/guard-rules \
            --show-summary all

  # --- the only job that touches AWS -------------------------------------------

  plan:
    name: plan (dev)
    runs-on: ubuntu-latest
    needs: [fmt, validate]
    # Forks have no access to the OIDC role, and a plan is not worth leaking one for.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write        # OIDC. No AWS_ACCESS_KEY_ID anywhere in this repo.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=env/dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - name: plan
        id: plan
        run: |
          terraform plan -input=false -lock=false \
            -var="project=${{ vars.PROJECT_ID }}" \
            -var-file=envs/dev.tfvars \
            -no-color 2>&1 | tail -c 60000 > plan.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### Terraform plan — dev\n\n```terraform\n' + plan + '\n```',
            });
