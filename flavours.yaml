# Environment flavours — one named bundle per environment shape.
#
# This replaces the legacy is_prod / is_monitoring / pod_auto_scale / pod_size flags.
# Four independent booleans is sixteen configurations nobody tested; a flavour is one
# name that fixes the whole set coherently. Any key can still be overridden per
# environment in envs/<env>.tfvars — see var.flavour_overrides.
#
# `sizes` is the right-sizing table. Services name a size in services.yaml rather than
# carrying numbers, so changing what "small" means moves every small service at once.
#
# Floor for a Spring service: 1024 MB. The buildpack's memory calculator reserves
# ~680 MB of fixed regions for these services before any heap (240 MB code cache,
# ~170 MB metaspace for ~28k classes, 250 x 1 MB thread stacks), so a 512 MB task
# cannot start a JVM at all: billing exited with "fixed memory regions require
# 680550K which is greater than 558560K available". Only the Node UIs fit in 512.
# That floor is the JVM's. The Spring services can also ship as GraalVM native
# executables (the hand-started 2-images-native build; 103-141 MB footprint on a live
# stack, cvhome qa/lcl-qa.md § 17), which fit in 512. 2-images, the default, still
# builds JVM images, so the sizes below must fit a JVM and stay as they are.
# The legacy stack gave all 15 services an identical 512/1024, which is the single
# largest easy cost win — and because pod services are billed once per pod, the saving
# multiplies by pod count.
#
# `ssr` is the storefront's own size (landing-ui), apart from `ui`, which the console keeps.
# The storefront renders every page on the server: about 200 ms of CPU a page as measured
# on 2026-09-13, so a quarter vCPU saturates near 1.2 pages a second, and a 30-shopper load
# test on dev held its task at 100 % with pages at 21–24 s. The console renders in the
# browser and idled through the same test, so raising `ui` would pay for nothing.
# After the render fixes and Node 24, a page still costs 70–73 ms of a Fargate vCPU (the
# heavy spikes of 2026-09-14), so half a vCPU serves about 7 page views a second, and a
# 500-shopper spike held one task at its cap for 2m15s with home's median at 42 s. Prod
# takes a whole vCPU: twice the pages per task before the queue starts, and twice the
# headroom while target tracking takes its minutes to add a task. Fargate pairs 1 vCPU with
# 2 GB at least.
#
# `auth` is uaa's own size, half a vCPU in every flavour. A seller's sign-in is a bcrypt
# password check, pure CPU: on dev, eight sign-ins a minute held uaa's quarter vCPU at 44 %
# with a p95 of 3.15 s, about 0.8 s of Fargate CPU each, and the production mix at 20x a
# normal day held it at 61 % (load-testing docs/baseline.md, 2026-09-13 and -14). A quarter
# vCPU is full at a handful of concurrent sign-ins, and a queue at the authorization server
# stalls every console login behind it. Prod's `small` was already half a vCPU, so prod's
# uaa does not change; `medium` would have doubled it there to 1 vCPU for nothing.

dev:
  description: "Cheapest thing that runs the whole product. Not for anyone's data."
  sizes:
    gateway: { cpu: 512, memory: 1024 }
    medium:  { cpu: 512, memory: 1024 }
    small:   { cpu: 256, memory: 1024 }
    ui:      { cpu: 256, memory: 512 }
    ssr:     { cpu: 512, memory: 1024 }
    auth:    { cpu: 512, memory: 1024 }
  desired_count: 1
  # No autoscaling below staging: one task, the cheapest thing that runs. The storefront
  # is the exception: landing-ui turns scaling on for itself (services.yaml).
  autoscaling:
    enabled: false
    schedules: []
  # Is this environment precious? Drives load balancer deletion protection
  # and whether buckets may be force-destroyed — decisions that previously
  # rode on rds.deletion_protection, which is about something else.
  protected: false
  # May a visitor re-theme the storefront for themselves with `?theme=<id>` / `?color=<PRESET>`?
  # A production build compiles those previews out unless STOREFRONT_THEME_OVERRIDE says
  # otherwise. Cookie-scoped to the browser that asks: a review tool, not a tenant's shop.
  storefront_previews: true
  # How long a storefront build's marker object is kept in the pod's CDN bucket. Its
  # static output is kept 30 days longer, so the marker always dies first: see the
  # lifecycle rules in modules/store-pod/storage.tf for why that ordering matters.
  # A task that runs longer than the asset window loses the assets it is serving, so
  # this wants to exceed the longest task lifetime the environment realistically sees.
  static_asset_retention_days: 30
  cdn_price_class: PriceClass_100
  capacity:
    # Pure Spot is fine where an interruption is an inconvenience, not an outage.
    on_demand_base: 0
    on_demand_percent: 0
  health_check_grace_seconds: 90
  log_retention_days: 7
  # CloudWatch Logs class for every service's log group. INFREQUENT_ACCESS ingests at
  # half the price ($0.25/GB against $0.50 in us-east-1) and is read through Logs Insights
  # only: no Live Tail, no `aws logs tail`, no ECS console log tab. The class is fixed
  # when a group is created, so changing it recreates the groups and drops their history.
  log_class: INFREQUENT_ACCESS
  monitoring: false
  # A CloudWatch dashboard built from the metrics AWS publishes by default (ECS, ALB, NLB,
  # RDS, CloudFront, NAT, the log groups). Independent of `monitoring`, which is the
  # collector, OTLP export and Container Insights. See modules/dashboard.
  dashboard: true
  network:
    # How tasks reach the internet: public_ip (a public IPv4 on every task, no NAT),
    # nat_instance (private tasks behind one EC2 instance) or nat_gateway (private
    # tasks behind the managed gateway). AWS bills every public IPv4 at $0.005/h, so the
    # fifteen task addresses public_ip spends here cost $54.75 a month; a t4g.nano and
    # its one address cost about $7.40. The gateway is $32.85 a month before any bytes.
    egress: nat_instance
    nat_instance_type: t4g.nano
  rds:
    instance_class: db.t4g.micro
    # One instance for store-core and the default pod, instead of one each ($13.98 a
    # month saved at us-east-1 list: a db.t4g.micro and 20 GB of gp3). Every service
    # owns a schema named after itself, so both layers sit side by side on one database,
    # as they already do under lcl. Other pods keep their own; their schemas would
    # collide with the default pod's.
    shared: true
    # Hikari maximum-pool-size per Spring task, unless a service sets its own
    # (services.yaml db_pool_size; catalog takes 8). RDS for PostgreSQL allows about 80
    # connections on a t4g.micro and 190 on a t4g.small, once it has taken its own share
    # of the memory. A rolling deploy briefly doubles every service, and at Hikari's
    # default of 10 the nine pod services alone asked for 180. Shared here, ten database
    # services at 3 and catalog at 8 make 76 mid-deploy; main.tf refuses a plan that
    # overflows.
    db_pool_size: 3
    # The most tasks a service with a database may scale to, whatever autoscaling.max
    # says: pools multiply by tasks and the instance's connections do not. Scaling is off
    # here, so every database service runs its one task and this binds nothing yet.
    db_max_tasks: 1
    allocated_storage: 20
    max_allocated_storage: 0
    backup_retention_days: 0
    deletion_protection: false
    skip_final_snapshot: true
    multi_az: false
    storage_encrypted: true
    performance_insights: false

staging:
  description: "Production's shape at a fraction of its size. Rehearsal, not theatre."
  sizes:
    gateway: { cpu: 512, memory: 1024 }
    medium:  { cpu: 512, memory: 1024 }
    small:   { cpu: 256, memory: 1024 }
    ui:      { cpu: 512, memory: 1024 }
    ssr:     { cpu: 512, memory: 1024 }
    auth:    { cpu: 512, memory: 1024 }
  desired_count: 1
  # Autoscaling on, cheaply — enough to prove the policy works before prod relies on it.
  autoscaling:
    enabled: true
    min: 1
    max: 3
    cpu_target: 75
    scale_out_cooldown: 60
    scale_in_cooldown: 300
    schedules: []
    # Worked example, opt-in. Scaling to zero overnight keeps the URL and the load
    # balancer alive while paying for no tasks — lighter than hibernating, which also
    # takes the load balancer and the database down.
    #
    # schedules:
    #   - name: weeknight-down
    #     schedule: "cron(0 20 ? * MON-FRI *)"
    #     timezone: Europe/Berlin
    #     min: 0
    #     max: 0
    #   - name: weekday-up
    #     schedule: "cron(0 7 ? * MON-FRI *)"
    #     timezone: Europe/Berlin
    #     min: 1
    #     max: 3
  # Is this environment precious? Drives load balancer deletion protection
  # and whether buckets may be force-destroyed — decisions that previously
  # rode on rds.deletion_protection, which is about something else.
  protected: false
  # May a visitor re-theme the storefront for themselves with `?theme=<id>` / `?color=<PRESET>`?
  # A production build compiles those previews out unless STOREFRONT_THEME_OVERRIDE says
  # otherwise. Cookie-scoped to the browser that asks: a review tool, not a tenant's shop.
  storefront_previews: true
  # How long a storefront build's marker object is kept in the pod's CDN bucket. Its
  # static output is kept 30 days longer, so the marker always dies first: see the
  # lifecycle rules in modules/store-pod/storage.tf for why that ordering matters.
  # A task that runs longer than the asset window loses the assets it is serving, so
  # this wants to exceed the longest task lifetime the environment realistically sees.
  static_asset_retention_days: 30
  cdn_price_class: PriceClass_100
  capacity:
    # Spot only, like dev. The base is per service and every staging service runs one
    # task, so a base of 1 put all sixteen tasks on on-demand Fargate (~$222/month at
    # us-east-1 list price). The trade: a reclaim is a short outage of that one service,
    # and ECS does not fall back to on-demand when Spot capacity runs short. Put the base
    # back for one environment with flavour_overrides = { capacity = { on_demand_base = 1 } }.
    on_demand_base: 0
    on_demand_percent: 0
  health_check_grace_seconds: 120
  log_retention_days: 14
  log_class: INFREQUENT_ACCESS
  monitoring: true
  dashboard: true
  network:
    egress: nat_instance
    nat_instance_type: t4g.nano
  rds:
    instance_class: db.t4g.small
    # Staging rehearses prod's per-pod database, and keeps its data.
    shared: false
    # Hikari maximum-pool-size per Spring task, unless a service sets its own
    # (services.yaml db_pool_size; catalog takes 8). RDS for PostgreSQL allows about 80
    # connections on a t4g.micro and 190 on a t4g.small, once it has taken its own share
    # of the memory. A rolling deploy briefly doubles every service, and at Hikari's
    # default of 10 the nine pod services alone asked for 180.
    db_pool_size: 6
    # The most tasks a service with a database may scale to (catalog twice that, by its
    # max_factor), prod's rule rehearsed: 1 to 2 tasks, catalog 1 to 4. The pod instance
    # then peaks at 104 of ~190 connections; main.tf shows the arithmetic.
    db_max_tasks: 2
    allocated_storage: 20
    max_allocated_storage: 100
    backup_retention_days: 1
    deletion_protection: false
    skip_final_snapshot: true
    multi_az: false
    storage_encrypted: true
    performance_insights: false

prod:
  description: "Tenant data lives here. Reliability wins every tie."
  sizes:
    gateway: { cpu: 1024, memory: 2048 }
    medium:  { cpu: 1024, memory: 2048 }
    small:   { cpu: 512,  memory: 1024 }
    ui:      { cpu: 512,  memory: 1024 }
    ssr:     { cpu: 1024, memory: 2048 }
    auth:    { cpu: 512,  memory: 1024 }
  desired_count: 2
  # Scale out fast, scale in slowly. A minute of over-provisioning costs pennies;
  # flapping under a rising load costs requests. Request-count tracking leads CPU on
  # the services that sit behind the load balancer, because queueing shows up in
  # request rate before it shows up in processor time.
  autoscaling:
    enabled: true
    min: 2
    max: 12
    cpu_target: 55
    memory_target: 70
    request_target: 800
    scale_out_cooldown: 60
    scale_in_cooldown: 600
    schedules: []
    # Worked example, opt-in: capacity for a spike known in advance. Target tracking
    # reacts in minutes (three one-minute datapoints over target, the metric's own lag,
    # then a task's start and health-check grace), and the 2026-09-14 spikes were over in
    # one, so the floor rises before the doors open and falls after. `max` is left out on
    # purpose: every service keeps its own ceiling. The floor lands clamped (main.tf):
    # spg, landing-ui, the gateway and the console run 6 tasks from the first minute;
    # the database services keep their floor of 2, inside the connection budget, and
    # catalog still scales to its 4 on CPU. `at()` fires once, in `timezone`. An apply
    # inside the window puts the floor back to 2 until the next action, so do not
    # deploy during a campaign; delete the pair once it is over.
    #
    # schedules:
    #   - name: campaign-doors-open
    #     schedule: "at(2026-11-27T07:30:00)"
    #     timezone: Europe/Berlin
    #     min: 6
    #   - name: campaign-over
    #     schedule: "at(2026-11-28T01:00:00)"
    #     timezone: Europe/Berlin
    #     min: 2
  # Is this environment precious? Drives load balancer deletion protection
  # and whether buckets may be force-destroyed — decisions that previously
  # rode on rds.deletion_protection, which is about something else.
  protected: true
  # May a visitor re-theme the storefront for themselves with `?theme=<id>` / `?color=<PRESET>`?
  # A production build compiles those previews out unless STOREFRONT_THEME_OVERRIDE says
  # otherwise. Cookie-scoped to the browser that asks: a review tool, not a tenant's shop.
  storefront_previews: false
  # How long a storefront build's marker object is kept in the pod's CDN bucket. Its
  # static output is kept 30 days longer, so the marker always dies first: see the
  # lifecycle rules in modules/store-pod/storage.tf for why that ordering matters.
  # A task that runs longer than the asset window loses the assets it is serving, so
  # this wants to exceed the longest task lifetime the environment realistically sees.
  static_asset_retention_days: 180
  cdn_price_class: PriceClass_All
  capacity:
    # An on-demand base means a Spot reclamation degrades capacity instead of
    # ending the service. The legacy stack ran weight-100 Spot at desired=1.
    on_demand_base: 1
    on_demand_percent: 50
  health_check_grace_seconds: 180
  log_retention_days: 30
  # Live Tail, metric filters and `aws logs tail` are worth the full price where tenants are.
  log_class: STANDARD
  monitoring: true
  dashboard: true
  network:
    # Managed availability for the one path every task takes out of the VPC.
    egress: nat_gateway
    nat_instance_type: t4g.nano
  rds:
    instance_class: db.t4g.small
    # Tenant data isolated at the instance boundary, one per pod (ADR-7).
    shared: false
    # Hikari maximum-pool-size per Spring task, unless a service sets its own
    # (services.yaml db_pool_size; catalog takes 8). RDS for PostgreSQL allows about 80
    # connections on a t4g.micro and 190 on a t4g.small, once it has taken its own share
    # of the memory. A rolling deploy briefly doubles every service, and at Hikari's
    # default of 10 the nine pod services alone asked for 180.
    db_pool_size: 6
    # The most tasks a service with a database may scale to, whatever autoscaling.max
    # says. Pools multiply by tasks and the instance's connections do not: with every
    # service free to reach 12 tasks, one pod's seven database services could have asked
    # for 7 x 6 x 12 = 504 connections of ~190 (the 2026-09-14 heavy spikes,
    # load-testing docs/baseline.md). At 2, the floor, the database services hold still
    # and catalog alone scales, to 4 (its max_factor); the instance peaks at 176 of ~190,
    # mid-deploy. The stateless edge (spg, landing-ui, the gateway, the console) keeps
    # scaling to 12 and beyond. If that stops being enough, the next step is RDS Proxy or
    # a bigger instance class, not a bigger number here.
    db_max_tasks: 2
    allocated_storage: 50
    max_allocated_storage: 500
    backup_retention_days: 7
    deletion_protection: true
    skip_final_snapshot: false
    multi_az: false
    storage_encrypted: true
    performance_insights: true

ephemeral:
  description: "Throwaway. Spun up for a branch or a demo, destroyed without ceremony."
  sizes:
    gateway: { cpu: 256, memory: 1024 }
    medium:  { cpu: 256, memory: 1024 }
    small:   { cpu: 256, memory: 1024 }
    ui:      { cpu: 256, memory: 512 }
    ssr:     { cpu: 256, memory: 512 }
    # Even here: a demo is mostly people signing in, and a quarter vCPU makes each one wait.
    auth:    { cpu: 512, memory: 1024 }
  desired_count: 1
  # Throwaway environments do not autoscale; they are destroyed instead. The storefront
  # still scales 1–3 on CPU (services.yaml, landing-ui), so a demo under load stays usable.
  autoscaling:
    enabled: false
    schedules: []
  # Is this environment precious? Drives load balancer deletion protection
  # and whether buckets may be force-destroyed — decisions that previously
  # rode on rds.deletion_protection, which is about something else.
  protected: false
  # May a visitor re-theme the storefront for themselves with `?theme=<id>` / `?color=<PRESET>`?
  # A production build compiles those previews out unless STOREFRONT_THEME_OVERRIDE says
  # otherwise. Cookie-scoped to the browser that asks: a review tool, not a tenant's shop.
  storefront_previews: true
  # How long a storefront build's marker object is kept in the pod's CDN bucket. Its
  # static output is kept 30 days longer, so the marker always dies first: see the
  # lifecycle rules in modules/store-pod/storage.tf for why that ordering matters.
  # A task that runs longer than the asset window loses the assets it is serving, so
  # this wants to exceed the longest task lifetime the environment realistically sees.
  static_asset_retention_days: 7
  cdn_price_class: PriceClass_100
  capacity:
    on_demand_base: 0
    on_demand_percent: 0
  health_check_grace_seconds: 90
  log_retention_days: 1
  log_class: INFREQUENT_ACCESS
  monitoring: false
  # Throwaway environments get no saved page; the console's automatic views are enough.
  dashboard: false
  network:
    egress: nat_instance
    nat_instance_type: t4g.nano
  rds:
    instance_class: db.t4g.micro
    # One instance for store-core and the default pod, as in dev.
    shared: true
    # Hikari maximum-pool-size per Spring task, unless a service sets its own
    # (services.yaml db_pool_size; catalog takes 8). RDS for PostgreSQL allows about 80
    # connections on a t4g.micro, once it has taken its own share of the memory. Shared
    # here, ten database services at 3 and catalog at 8 make 76 mid-deploy.
    db_pool_size: 3
    # One task per database service, as in dev; scaling is off here anyway.
    db_max_tasks: 1
    allocated_storage: 20
    max_allocated_storage: 0
    backup_retention_days: 0
    deletion_protection: false
    skip_final_snapshot: true
    multi_az: false
    storage_encrypted: true
    performance_insights: false
