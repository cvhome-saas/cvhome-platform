AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  CVHome platform bootstrap. Creates only what Terraform cannot create for itself:
  the state bucket, a scoped deploy role, the environment's config record, and the
  CodeBuild projects. It then starts the pipeline. Everything else is Terraform.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Environment }
        Parameters: [ProjectId, EnvName, Flavour, DomainZoneId]
      - Label: { default: Store pods }
        Parameters: [PodCount]
      - Label: { default: Integrations }
        Parameters: [StripeKey]
      - Label: { default: Source }
        Parameters: [GithubAccount, PlatformRepo, AppRepo, Branch, ImageTag]
    ParameterLabels:
      ProjectId: { default: Project id }
      EnvName: { default: Environment name }
      Flavour: { default: Flavour }
      DomainZoneId: { default: Route53 hosted zone }
      PodCount: { default: Additional store pods }
      StripeKey: { default: Stripe secret key }
      ImageTag: { default: Product version }

Parameters:
  ProjectId:
    Type: String
    Default: cvhome
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,17}$"
    Description: >-
      Stable identifier shared by every environment in this account. Deliberately NOT
      random: the legacy stack generated a random 4-character id here while GitHub
      Actions derived a different one, so images were pushed where Terraform never
      looked. Keep this the same across environments.

  EnvName:
    Type: String
    Default: dev
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,9}$"
    Description: >-
      Environment name. One stack is one environment. Below prod every hostname sits
      under this label (console-ui.dev.example.com), so several environments can share
      one hosted zone; prod owns the bare apex. Length is capped because project and
      env together feed IAM role names, which stop at 64 characters.

  Flavour:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod, ephemeral]
    Description: >-
      Fixes sizing, capacity policy, RDS class and backups, log retention, monitoring
      and networking as one coherent set. prod runs tasks in private subnets behind a
      NAT gateway and enables RDS backups and deletion protection.

  DomainZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: The application is served from this zone, and the certificate validated in it.

  PodCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 20
    Description: >-
      Store pods IN ADDITION to the default one. Each pod is roughly a second small
      environment in cost terms: its own RDS instance, network load balancer,
      CloudFront distribution and nine ECS services.

  StripeKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Stripe secret key. Bound to the billing service, which is where Stripe lives.

  GithubAccount:
    Type: String
    Default: cvhome-saas
    AllowedPattern: "^[A-Za-z0-9_-]+$"

  PlatformRepo:
    Type: String
    Default: cvhome-platform

  AppRepo:
    Type: String
    Default: cvhome

  Branch:
    Type: String
    Default: main
    Description: >-
      Branch of both repositories the pipeline builds and applies from. The image
      build ignores it when ImageTag names a release: it then checks out the
      application at tag v<ImageTag>.

  ImageTag:
    Type: String
    Default: latest
    AllowedPattern: "^(latest|[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?)$"
    Description: >-
      Product version to deploy; see cvhome-saas/orchestrator releases/. Written to
      the environment's SSM config as image_tag, which envs/<env>.tfvars overrides
      once the promotion PR has landed. latest is only for the cut-over before the
      first tagged release (2.0.0) and for ephemeral environments built from a branch.

Conditions:
  HasStripeKey: !Not [!Equals [!Ref StripeKey, ""]]
  # A release: the image build checks the application out at its tag and Gradle
  # names the images after it. Anything else is a branch build tagged latest only.
  ImageTagIsVersion: !Not [!Equals [!Ref ImageTag, latest]]

Resources:
  # ==========================================================================
  # State bucket — Terraform cannot create the bucket that holds its own state.
  # ==========================================================================

  TerraformStateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectId}-${EnvName}-tfstate-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # State locking is native to S3 from Terraform 1.10 (use_lockfile).
      # No DynamoDB table, no extra cost.

  # ==========================================================================
  # Secrets — values a human supplied, or that RDS will not mint for us.
  # ==========================================================================

  StripeSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${ProjectId}/${EnvName}/stripe"
      Description: Stripe credentials, injected into the billing service
      SecretString: !Sub |
        {"STRIPE_KEY": "${StripeKey}", "STRIPE_WEBHOOK-SIGNING-KEY": ""}

  UaaSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${ProjectId}/${EnvName}/uaa"
      Description: Initial platform admin credentials for uaa
      GenerateSecretString:
        SecretStringTemplate: '{"username": "admin"}'
        GenerateStringKey: COM_ASREVO_CVHOME_ADMIN_PASSWORD
        PasswordLength: 24
        ExcludePunctuation: true

  # The SSO material nobody types: uaa's four client secrets, the two remember-me
  # keys, and one crypto key per layer that wraps every value the secret-crypto
  # provider stores at rest (uaa's and cua's signing keys, billing's and payment's
  # provider credentials). One secret, many keys, so services.yaml binds them by
  # json key like the others. GenerateSecretString mints exactly one value per
  # secret, so a Lambda fills this one in. It never rotates: on Create it writes
  # every key, on Update it adds only the keys that are missing, so a key added
  # to the template later reaches an existing environment without touching the
  # values every service and uaa's database already hold.
  SsoSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${ProjectId}/${EnvName}/sso"
      Description: Generated OAuth2 client secrets and key material for uaa and cua
      SecretString: "{}"

  SsoSecretsFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: write-sso-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                Resource: !Ref SsoSecret

  SsoSecretsFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt SsoSecretsFunctionRole.Arn
      Code:
        ZipFile: |
          import base64, json, secrets
          import boto3
          import cfnresponse

          # Client secrets and cookie keys: 43 URL-safe characters, which is what a
          # client_secret_basic header and a remember-me HMAC are happy with. Crypto
          # keys: 32 random bytes, standard base64, because the application's
          # EnvironmentVariableKeyProvider base64-decodes COM_ASREVO_CVHOME_CRYPTO_KEY
          # into an AES-256 key.
          GENERATORS = {
              "UAA_ADMIN_SDK_SECRET": lambda: secrets.token_urlsafe(32),
              "UAA_STORE_POD_SECRET": lambda: secrets.token_urlsafe(32),
              "UAA_STORE_CORE_SECRET": lambda: secrets.token_urlsafe(32),
              "UAA_WEB_APP_SECRET": lambda: secrets.token_urlsafe(32),
              "UAA_IMPERSONATION_SECRET": lambda: secrets.token_urlsafe(32),
              "UAA_REMEMBER_ME_KEY": lambda: secrets.token_urlsafe(32),
              "CUA_REMEMBER_ME_KEY": lambda: secrets.token_urlsafe(32),
              "CORE_CRYPTO_KEY": lambda: base64.b64encode(secrets.token_bytes(32)).decode(),
              "POD_CRYPTO_KEY": lambda: base64.b64encode(secrets.token_bytes(32)).decode(),
          }

          def handler(event, context):
              try:
                  if event["RequestType"] == "Delete":
                      return cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, event["PhysicalResourceId"])
                  sm = boto3.client("secretsmanager")
                  secret_id = event["ResourceProperties"]["SecretId"]
                  current = {}
                  if event["RequestType"] == "Update":
                      try:
                          current = json.loads(sm.get_secret_value(SecretId=secret_id)["SecretString"] or "{}")
                      except Exception:
                          current = {}
                  # Existing values are never regenerated: every service already holds
                  # them, and uaa's database holds the client secrets. Rotation is a
                  # deliberate act, not a side effect of a stack update.
                  missing = {k: g() for k, g in GENERATORS.items() if not current.get(k)}
                  if missing:
                      current.update(missing)
                      sm.put_secret_value(SecretId=secret_id, SecretString=json.dumps(current))
                  return cfnresponse.send(event, context, cfnresponse.SUCCESS,
                                          {"Added": ",".join(sorted(missing))}, "sso-secret-value")
              except Exception as exc:
                  return cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(exc)})

  SsoSecretValue:
    Type: Custom::SsoSecretValue
    Properties:
      ServiceToken: !GetAtt SsoSecretsFunction.Arn
      SecretId: !Ref SsoSecret
      # CloudFormation sends a custom resource an Update only when its properties
      # change. Listing the keys here is what makes adding one reach a running stack.
      Keys: UAA_ADMIN_SDK_SECRET,UAA_STORE_POD_SECRET,UAA_STORE_CORE_SECRET,UAA_WEB_APP_SECRET,UAA_IMPERSONATION_SECRET,UAA_REMEMBER_ME_KEY,CUA_REMEMBER_ME_KEY,CORE_CRYPTO_KEY,POD_CRYPTO_KEY

  # ==========================================================================
  # Pod identifiers
  # ==========================================================================

  PodIdFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  PodIdFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt PodIdFunctionRole.Arn
      Code:
        ZipFile: |
          import json, secrets
          import cfnresponse

          def handler(event, context):
              try:
                  if event["RequestType"] == "Delete":
                      return cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, event["PhysicalResourceId"])
                  count = int(event["ResourceProperties"].get("PodCount", 0))

                  # 24 hex characters, FULLY RANDOM. Not an ObjectId shape: an ObjectId
                  # begins with a 4-byte timestamp, and Terraform takes substr(id, 0, 8)
                  # as the pod's short name -- which would be exactly that timestamp.
                  # Every pod generated in this one loop shares the same second, so they
                  # would all collapse to one short name, one Cloud Map namespace, one
                  # load balancer name and one DNS record.
                  ids = []
                  while len(ids) < count:
                      candidate = secrets.token_hex(12)
                      # Belt and braces: the 8-character prefix is what must be unique.
                      if all(candidate[:8] != existing[:8] for existing in ids):
                          ids.append(candidate)

                  return cfnresponse.send(
                      event, context, cfnresponse.SUCCESS,
                      {"PodIdsJson": json.dumps(ids)},
                      "podids",
                  )
              except Exception as exc:
                  return cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(exc)})

  PodIds:
    Type: Custom::PodIds
    Properties:
      ServiceToken: !GetAtt PodIdFunction.Arn
      PodCount: !Ref PodCount

  # ==========================================================================
  # The environment's config record. Terraform reads this; envs/<env>.tfvars
  # overrides it. Note `env` is a real value here — the legacy template
  # hardcoded "dev" at bootstrap.yaml:451, so one stack could only ever be dev.
  # ==========================================================================

  ConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectId}/${EnvName}/config"
      Type: String
      Description: Generated configuration for this CVHome environment
      Value: !Sub
        - |
          {
            "project": "${ProjectId}",
            "env": "${EnvName}",
            "flavour": "${Flavour}",
            "region": "${AWS::Region}",
            "hosted_zone_id": "${DomainZoneId}",
            "image_tag": "${ImageTag}",
            "pod_ids": ${PodIdsJson},
            "state_bucket": "${TerraformStateBucket}"
          }
        - PodIdsJson: !GetAtt PodIds.PodIdsJson

  # ==========================================================================
  # Deploy role. Explicit statements, not PowerUserAccess + iam:* — which is what
  # the legacy template granted (bootstrap.yaml:992).
  # ==========================================================================

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectId}-${EnvName}-deploy"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: infrastructure
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Resource-level scoping is not expressible for most of these
              # (VPC creation has no ARN to name in advance), so the narrowing that
              # matters is by service and by region, plus the IAM boundary below.
              - Sid: Infrastructure
                Effect: Allow
                Action:
                  - ec2:*
                  - ecs:*
                  - ecr:*
                  - elasticloadbalancing:*
                  - rds:*
                  - servicediscovery:*
                  - application-autoscaling:*
                  - logs:*
                  - cloudwatch:*
                  - acm:*
                  - route53:*
                  - cloudfront:*
                  - s3:*
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: [!Ref "AWS::Region", us-east-1]

              # Terraform cannot stop or start a database — aws_db_instance exposes
              # only a read-only status — so the hibernate and wake scripts call the
              # API directly and these two actions are theirs.
              - Sid: HibernationStateChange
                Effect: Allow
                Action: [rds:StopDBInstance, rds:StartDBInstance]
                Resource: !Sub "arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:*"

              # Covers the hibernation flag and the prereq outputs the environment
              # apply reads back. The tag actions are not extra reach: the provider
              # sets default_tags on every resource, so tagging is part of creating a
              # parameter and PutParameter alone fails with AccessDeniedException on
              # ssm:AddTagsToResource. DeleteParameter is what lets the destroy project
              # tear the parameter down again.
              - Sid: WriteParameters
                Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                  - ssm:AddTagsToResource
                  - ssm:RemoveTagsFromResource
                  - ssm:ListTagsForResource
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectId}/*"

              # DescribeParameters is a list operation. IAM evaluates it against
              # arn:aws:ssm:<region>:<account>:* rather than against any one parameter,
              # so a path-scoped Resource cannot match and every call is denied. That is
              # what the AccessDeniedException reported: the resource it named was the
              # account wildcard, not parameter/cvhome/dev/prereq. The provider reads
              # parameter metadata through it, so a plan cannot run without it.
              #
              # This grants metadata only. Reading a parameter value still needs
              # ReadConfigAndSecrets below, which stays scoped to the project prefix.
              - Sid: ListParameterMetadata
                Effect: Allow
                Action: ssm:DescribeParameters
                Resource: "*"

              - Sid: ReadConfigAndSecrets
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetResourcePolicy
                  - secretsmanager:GetSecretValue
                  - secretsmanager:ListSecretVersionIds
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectId}/*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${ProjectId}/*"

              # RDS-managed master passwords land in Secrets Manager under an
              # AWS-chosen name, so this cannot be scoped by prefix.
              - Sid: RdsManagedSecrets
                Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:TagResource
                  - secretsmanager:RotateSecret
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref "AWS::Region"

              # The legacy role held iam:* outright. This can only touch roles it
              # created for this project's own tasks.
              # manage_master_user_password makes RDS create the master password secret,
              # encrypted with the AWS managed aws/secretsmanager key, and the calling
              # principal is checked against that key. CloudTrail for the failed
              # CreateDBInstance shows DescribeKey on alias/aws/rds succeeding through
              # that key's own policy, then DescribeKey on the aws/secretsmanager key
              # denied, and the create returning KMSKeyNotAccessibleFault [null].
              #
              # The AWS managed key ids are generated per account and per region, so
              # they cannot be named in this template. DescribeKey returns metadata
              # only. CreateGrant is confined to grants AWS services make for
              # themselves, which is what RDS and Secrets Manager need here, and is not
              # enough to hand a key to anything else.
              - Sid: ManagedEncryptionKeys
                Effect: Allow
                Action: kms:DescribeKey
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref "AWS::Region"

              - Sid: ManagedEncryptionGrants
                Effect: Allow
                Action: kms:CreateGrant
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref "AWS::Region"
                  Bool:
                    kms:GrantIsForAWSResource: "true"

              # ListInstanceProfilesForRole is part of deleting a role, not of reading
              # one: the provider looks for instance profiles to detach before it calls
              # DeleteRole, and a denial there fails the delete. These are ECS task and
              # execution roles, so the answer is always empty and no
              # RemoveRoleFromInstanceProfile ever follows.
              #
              # Every other service here is granted as <service>:*, so their delete paths
              # were covered by accident. IAM is the one narrowly scoped grant, which is
              # why it is the one that broke on destroy and not on apply.
              - Sid: ScopedIam
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectId}-${EnvName}-*"

              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
                Condition:
                  StringEquals:
                    iam:AWSServiceName:
                      - ecs.amazonaws.com
                      - rds.amazonaws.com
                      - elasticloadbalancing.amazonaws.com
                      - application-autoscaling.amazonaws.com

        - PolicyName: terraform-state
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt TerraformStateBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${TerraformStateBucket.Arn}/*"

        - PolicyName: logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*"

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectId}-${EnvName}-build"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPushThisProject
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectId}/*"
              - Sid: ReadConfig
                Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectId}/*"
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*"

  # ==========================================================================
  # Pipeline: prereq apply -> image build -> env apply.
  # ==========================================================================

  PrereqProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${ProjectId}-${EnvName}-1-prereq"
      Description: ECR repositories and the ACM certificate, from the service catalog
      ServiceRole: !GetAtt DeployRole.Arn
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: PROJECT_ID, Value: !Ref ProjectId }
          - { Name: ENV_NAME, Value: !Ref EnvName }
          - { Name: TF_STATE_BUCKET, Value: !Ref TerraformStateBucket }
      Source:
        Type: GITHUB
        Location: !Sub "https://github.com/${GithubAccount}/${PlatformRepo}.git"
        BuildSpec: |
          version: 0.2
          phases:
            install:
              commands:
                - cd /usr/local/bin
                - wget -q https://releases.hashicorp.com/terraform/1.14.6/terraform_1.14.6_linux_amd64.zip
                - unzip -o -q terraform_1.14.6_linux_amd64.zip && terraform version
                - cd $CODEBUILD_SRC_DIR
            build:
              commands:
                - cd prereq
                - |
                  terraform init -input=false \
                    -backend-config="bucket=$TF_STATE_BUCKET" \
                    -backend-config="key=prereq/$ENV_NAME/terraform.tfstate" \
                    -backend-config="region=$AWS_REGION"
                - |
                  terraform apply -auto-approve -input=false \
                    -var="project=$PROJECT_ID" \
                    -var="env=$ENV_NAME" \
                    -var="region=$AWS_REGION"
            post_build:
              commands:
                # ECR does not create repositories on push. If this count is wrong,
                # the image build fails and it is not obvious why.
                - terraform output repository_count
      SourceVersion: !Ref Branch
      TimeoutInMinutes: 30

  ImageBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${ProjectId}-${EnvName}-2-images"
      Description: Build and push all 15 service images, named after ImageTag
      ServiceRole: !GetAtt BuildRole.Arn
      Artifacts: { Type: NO_ARTIFACTS }
      # Measured on build e5942837: 826s total, of which bootBuildImage is 606s. Inside
      # that, the buildpack builder image was pulled 12 times, the run image 12 times and
      # the syft binary downloaded 12 times, because the lifecycle runs in a fresh
      # container per service and nothing was retained between them.
      #
      # DOCKER_LAYER keeps the builder and run images on the host, so those pulls become
      # local after the first. CUSTOM keeps the paths the buildspec names below, which is
      # what makes --build-cache and the Gradle distribution download mean anything across
      # builds: without it the -Dorg.gradle.caching=true above writes a cache that is
      # thrown away with the container.
      #
      # LOCAL caching is opportunistic. It pays off when CodeBuild reuses a warm host and
      # costs nothing when it does not, so a cold build is simply today's timing.
      Cache:
        Type: LOCAL
        Modes:
          - LOCAL_DOCKER_LAYER_CACHE
          - LOCAL_CUSTOM_CACHE
          - LOCAL_SOURCE_CACHE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - { Name: PROJECT_ID, Value: !Ref ProjectId }
          # The version the images are published under. Gradle tags a release
          # X.Y.Z, X.Y and latest; a branch build (latest) gets no -Pversion, stays
          # 0.0.0-SNAPSHOT and publishes latest only, so it can never overwrite a
          # released tag.
          - { Name: IMAGE_TAG, Value: !Ref ImageTag }
          - Name: REGISTRY
            Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectId}"
          - Name: GRADLE_OPTS
            Value: >-
              -Dorg.gradle.jvmargs=-Xmx10g
              -Dorg.gradle.daemon=false
              -Dorg.gradle.parallel=true
              -Dorg.gradle.caching=true
      Source:
        Type: GITHUB
        Location: !Sub "https://github.com/${GithubAccount}/${AppRepo}.git"
        BuildSpec: |
          version: 0.2
          # Read by LOCAL_CUSTOM_CACHE. caches/ is the resolved dependency and build cache;
          # wrapper/ is the Gradle distribution itself, which was re-downloaded every build.
          cache:
            paths:
              - "/root/.gradle/caches/**/*"
              - "/root/.gradle/wrapper/**/*"
          phases:
            install:
              runtime-versions:
                java: corretto25
            pre_build:
              commands:
                - export ECR_TOKEN=$(aws ecr get-login-password --region $AWS_REGION)
                - echo "$ECR_TOKEN" | docker login --username AWS --password-stdin "${REGISTRY%%/*}"
            build:
              commands:
                - chmod +x gradlew
                - |
                  VERSION_FLAG=""
                  if [ "$IMAGE_TAG" != "latest" ]; then
                    VERSION_FLAG="-Pversion=$IMAGE_TAG"
                  fi
                  echo "Publishing images as ${IMAGE_TAG} from $(git rev-parse --short HEAD 2>/dev/null || echo "$CODEBUILD_RESOLVED_SOURCE_VERSION")"
                  ./gradlew bootBuildImage --publishImage $VERSION_FLAG -x test -x check --no-daemon --parallel --build-cache
      # A release builds the application at its tag, so the images named X.Y.Z are
      # built from the commit that carries vX.Y.Z and nothing else. The chaining
      # rule starts this project with no overrides, so the project default is what
      # runs. CodeBuild accepts a tag name here for GitHub sources.
      SourceVersion: !If [ImageTagIsVersion, !Sub "v${ImageTag}", !Ref Branch]
      TimeoutInMinutes: 120

  # The same image build with the twelve Spring services compiled as GraalVM native
  # executables (cvhome: bootBuildImage -Pnative, references/build-system.md). Nothing in
  # the pipeline starts it: 2-images above, the JVM build, is the default. Start this one
  # by hand when an environment should run native; on success it provisions the
  # environment like 2-images does (NativeImagesSucceededRule). Both publish the same
  # names and tags, so whichever ran last is what the environment runs; start 2-images to
  # go back to the JVM. Do not start it while the pipeline is running: the two builds
  # would race for the tags and their applies for the state lock.
  #
  # Machine: on a 14-core laptop one service compiles in 52 s to 1m37s and the largest
  # (payment) peaks at 11.9 GB of compiler heap; at 7 GB it runs out. LARGE's 15 GB could
  # run them only one at a time. XLARGE (36 vCPU, 70 GB) runs four at once with each
  # compiler capped at 12 GB (-PnativeImageArgs): 4 x ~13.5 GB resident leaves room for
  # Gradle (-Xmx10g) and Docker. The laptop built the twelve in 17 minutes three at a
  # time; the first CodeBuild run is the number to put here, with the host's peak memory.
  NativeImageBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${ProjectId}-${EnvName}-2-images-native"
      Description: Build and push all 15 service images with the Spring services as GraalVM native executables, started by hand
      ServiceRole: !GetAtt BuildRole.Arn
      Artifacts: { Type: NO_ARTIFACTS }
      Cache:
        Type: LOCAL
        Modes:
          - LOCAL_DOCKER_LAYER_CACHE
          - LOCAL_CUSTOM_CACHE
          - LOCAL_SOURCE_CACHE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_XLARGE
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - { Name: PROJECT_ID, Value: !Ref ProjectId }
          - { Name: IMAGE_TAG, Value: !Ref ImageTag }
          - Name: REGISTRY
            Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectId}"
          - Name: GRADLE_OPTS
            Value: >-
              -Dorg.gradle.jvmargs=-Xmx10g
              -Dorg.gradle.daemon=false
              -Dorg.gradle.parallel=true
              -Dorg.gradle.caching=true
      Source:
        Type: GITHUB
        Location: !Sub "https://github.com/${GithubAccount}/${AppRepo}.git"
        # 2-images' buildspec with -Pnative and the compiler cap. A cvhome version
        # older than its native build ignores both flags and builds JVM images.
        BuildSpec: |
          version: 0.2
          cache:
            paths:
              - "/root/.gradle/caches/**/*"
              - "/root/.gradle/wrapper/**/*"
          phases:
            install:
              runtime-versions:
                java: corretto25
            pre_build:
              commands:
                - export ECR_TOKEN=$(aws ecr get-login-password --region $AWS_REGION)
                - echo "$ECR_TOKEN" | docker login --username AWS --password-stdin "${REGISTRY%%/*}"
            build:
              commands:
                - chmod +x gradlew
                - |
                  VERSION_FLAG=""
                  if [ "$IMAGE_TAG" != "latest" ]; then
                    VERSION_FLAG="-Pversion=$IMAGE_TAG"
                  fi
                  echo "Publishing native images as ${IMAGE_TAG} from $(git rev-parse --short HEAD 2>/dev/null || echo "$CODEBUILD_RESOLVED_SOURCE_VERSION")"
                  ./gradlew bootBuildImage --publishImage -Pnative -PnativeImageArgs=-J-Xmx12g $VERSION_FLAG \
                    -x test -x check --no-daemon --parallel --max-workers=4 --build-cache
      SourceVersion: !If [ImageTagIsVersion, !Sub "v${ImageTag}", !Ref Branch]
      TimeoutInMinutes: 120

  EnvProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${ProjectId}-${EnvName}-3-apply"
      Description: Provision the environment
      ServiceRole: !GetAtt DeployRole.Arn
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: PROJECT_ID, Value: !Ref ProjectId }
          - { Name: ENV_NAME, Value: !Ref EnvName }
          - { Name: FLAVOUR, Value: !Ref Flavour }
          - { Name: TF_STATE_BUCKET, Value: !Ref TerraformStateBucket }
          - { Name: STRIPE_SECRET, Value: !Ref StripeSecret }
      Source:
        Type: GITHUB
        Location: !Sub "https://github.com/${GithubAccount}/${PlatformRepo}.git"
        BuildSpec: |
          version: 0.2
          phases:
            install:
              commands:
                - cd /usr/local/bin
                - wget -q https://releases.hashicorp.com/terraform/1.14.6/terraform_1.14.6_linux_amd64.zip
                - unzip -o -q terraform_1.14.6_linux_amd64.zip && terraform version
                - cd $CODEBUILD_SRC_DIR
            build:
              commands:
                - |
                  terraform init -input=false \
                    -backend-config="bucket=$TF_STATE_BUCKET" \
                    -backend-config="key=env/$ENV_NAME/terraform.tfstate" \
                    -backend-config="region=$AWS_REGION"
                - VARFILE="envs/$ENV_NAME.tfvars"; [ -f "$VARFILE" ] || VARFILE="envs/dev.tfvars"
                - |
                  terraform apply -auto-approve -input=false \
                    -var="project=$PROJECT_ID" \
                    -var="env=$ENV_NAME" \
                    -var="flavour=$FLAVOUR" \
                    -var="region=$AWS_REGION" \
                    -var-file="$VARFILE"
            post_build:
              commands:
                - terraform output -json > outputs.json
                # Registered here, not in CloudFormation, because the domain only
                # exists once the environment is up. The legacy template registered
                # /subscription/api/v1/... at bootstrap time — a path that did not
                # survive the tenancy/billing split.
                - |
                  DOMAIN=$(terraform output -raw console_url 2>/dev/null | sed 's#https://console-ui\.##')
                  if [ -n "$DOMAIN" ]; then
                    scripts/register-stripe-webhook.sh "https://$DOMAIN/billing/api/v1/stripe-webhook/public/events"
                  fi
                - terraform output console_url
      SourceVersion: !Ref Branch
      TimeoutInMinutes: 60

  DestroyProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${ProjectId}-${EnvName}-destroy"
      Description: Tear the environment down
      ServiceRole: !GetAtt DeployRole.Arn
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: PROJECT_ID, Value: !Ref ProjectId }
          - { Name: ENV_NAME, Value: !Ref EnvName }
          - { Name: FLAVOUR, Value: !Ref Flavour }
          - { Name: TF_STATE_BUCKET, Value: !Ref TerraformStateBucket }
      Source:
        Type: GITHUB
        Location: !Sub "https://github.com/${GithubAccount}/${PlatformRepo}.git"
        BuildSpec: |
          version: 0.2
          phases:
            install:
              commands:
                - cd /usr/local/bin
                - wget -q https://releases.hashicorp.com/terraform/1.14.6/terraform_1.14.6_linux_amd64.zip
                - unzip -o -q terraform_1.14.6_linux_amd64.zip
                - cd $CODEBUILD_SRC_DIR
            build:
              commands:
                - |
                  terraform init -input=false \
                    -backend-config="bucket=$TF_STATE_BUCKET" \
                    -backend-config="key=env/$ENV_NAME/terraform.tfstate" \
                    -backend-config="region=$AWS_REGION"
                - VARFILE="envs/$ENV_NAME.tfvars"; [ -f "$VARFILE" ] || VARFILE="envs/dev.tfvars"
                - |
                  terraform destroy -auto-approve -input=false \
                    -var="project=$PROJECT_ID" -var="env=$ENV_NAME" \
                    -var="flavour=$FLAVOUR" -var="region=$AWS_REGION" \
                    -var-file="$VARFILE"
      SourceVersion: !Ref Branch
      TimeoutInMinutes: 60


  # ==========================================================================
  # Hibernation
  #
  # Destroys everything billed by the hour and keeps everything holding state.
  # Two CodeBuild projects drive it, plus a keeper that works around a hard AWS
  # limit: a stopped RDS instance is started again automatically after seven days.
  # ==========================================================================

  HibernatedFlag:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectId}/${EnvName}/hibernated"
      Type: String
      Value: "false"
      Description: Whether this environment is meant to be asleep. Read by the keeper.

  HibernateProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${ProjectId}-${EnvName}-hibernate"
      Description: Destroy compute, keep state, stop the databases
      ServiceRole: !GetAtt DeployRole.Arn
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: PROJECT_ID, Value: !Ref ProjectId }
          - { Name: ENV_NAME, Value: !Ref EnvName }
          - { Name: TF_STATE_BUCKET, Value: !Ref TerraformStateBucket }
      Source:
        Type: GITHUB
        Location: !Sub "https://github.com/${GithubAccount}/${PlatformRepo}.git"
        BuildSpec: |
          version: 0.2
          phases:
            install:
              commands:
                - cd /usr/local/bin
                - wget -q https://releases.hashicorp.com/terraform/1.14.6/terraform_1.14.6_linux_amd64.zip
                - unzip -o -q terraform_1.14.6_linux_amd64.zip
                - cd $CODEBUILD_SRC_DIR
            build:
              commands:
                - scripts/hibernate.sh "$ENV_NAME"
      SourceVersion: !Ref Branch
      TimeoutInMinutes: 60

  WakeProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${ProjectId}-${EnvName}-wake"
      Description: Start the databases, then rebuild compute
      ServiceRole: !GetAtt DeployRole.Arn
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: PROJECT_ID, Value: !Ref ProjectId }
          - { Name: ENV_NAME, Value: !Ref EnvName }
          - { Name: TF_STATE_BUCKET, Value: !Ref TerraformStateBucket }
      Source:
        Type: GITHUB
        Location: !Sub "https://github.com/${GithubAccount}/${PlatformRepo}.git"
        BuildSpec: |
          version: 0.2
          phases:
            install:
              commands:
                - cd /usr/local/bin
                - wget -q https://releases.hashicorp.com/terraform/1.14.6/terraform_1.14.6_linux_amd64.zip
                - unzip -o -q terraform_1.14.6_linux_amd64.zip
                - cd $CODEBUILD_SRC_DIR
            build:
              commands:
                - scripts/wake.sh "$ENV_NAME"
      SourceVersion: !Ref Branch
      # Starting a stopped instance is minutes, not seconds, and the script waits.
      TimeoutInMinutes: 90

  # --- the keeper --------------------------------------------------------------
  #
  # AWS restarts a stopped RDS instance after seven days. Without this, a hibernated
  # environment silently resumes paying for database compute on day eight, which is
  # exactly the cost hibernation existed to avoid. The keeper runs daily, and stops
  # anything that is running while the flag says the environment should be asleep.

  HibernationKeeperRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: keeper
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [rds:DescribeDBInstances, rds:ListTagsForResource]
                Resource: "*"
              - Effect: Allow
                Action: rds:StopDBInstance
                Resource: !Sub "arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:*"
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectId}/*"

  HibernationKeeperFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 120
      Role: !GetAtt HibernationKeeperRole.Arn
      Environment:
        Variables:
          PROJECT_ID: !Ref ProjectId
          ENV_NAME: !Ref EnvName
      Code:
        ZipFile: |
          import os
          import boto3

          def handler(event, context):
              project = os.environ["PROJECT_ID"]
              env = os.environ["ENV_NAME"]

              ssm = boto3.client("ssm")
              try:
                  flag = ssm.get_parameter(Name=f"/{project}/{env}/hibernated")["Parameter"]["Value"]
              except ssm.exceptions.ParameterNotFound:
                  return {"skipped": "no hibernation flag"}

              if flag.strip().lower() != "true":
                  return {"skipped": "environment is awake"}

              rds = boto3.client("rds")
              stopped = []
              for page in rds.get_paginator("describe_db_instances").paginate():
                  for db in page["DBInstances"]:
                      tags = {t["Key"]: t["Value"] for t in db.get("TagList", [])}
                      if tags.get("Project") != project or tags.get("Environment") != env:
                          continue
                      if db["DBInstanceStatus"] != "available":
                          continue
                      # Reached here because AWS restarted it at the seven day mark.
                      rds.stop_db_instance(DBInstanceIdentifier=db["DBInstanceIdentifier"])
                      stopped.append(db["DBInstanceIdentifier"])

              return {"re_stopped": stopped}

  HibernationKeeperSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: !Sub "Re-stop ${ProjectId}/${EnvName} databases that AWS auto-started"
      ScheduleExpression: rate(1 day)
      State: ENABLED
      Targets:
        - Id: keeper
          Arn: !GetAtt HibernationKeeperFunction.Arn

  HibernationKeeperPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt HibernationKeeperFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt HibernationKeeperSchedule.Arn

  # ==========================================================================
  # Start the pipeline. Nothing did this in the legacy template, which is why its
  # "one-click" deploy completed the stack and then provisioned nothing.
  # ==========================================================================

  PipelineStarterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: start-builds
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: codebuild:StartBuild
                Resource:
                  - !GetAtt PrereqProject.Arn
                  - !GetAtt ImageBuildProject.Arn
                  - !GetAtt EnvProject.Arn

  PipelineStarterFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt PipelineStarterRole.Arn
      Environment:
        Variables:
          PREREQ_PROJECT: !Ref PrereqProject
      Code:
        ZipFile: |
          import os
          import boto3
          import cfnresponse

          def handler(event, context):
              try:
                  if event["RequestType"] != "Create":
                      return cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, "starter")
                  # Only the first stage is started here. Each stage chains the next
                  # via its own EventBridge rule, so a failure stops the pipeline
                  # instead of racing ahead to an apply that cannot work.
                  build = boto3.client("codebuild").start_build(
                      projectName=os.environ["PREREQ_PROJECT"]
                  )
                  return cfnresponse.send(
                      event, context, cfnresponse.SUCCESS,
                      {"BuildId": build["build"]["id"]}, "starter",
                  )
              except Exception as exc:
                  # A failed kickoff must not roll back a stack that is otherwise fine;
                  # the pipeline can be started by hand from the console.
                  return cfnresponse.send(
                      event, context, cfnresponse.SUCCESS, {"Error": str(exc)}, "starter",
                  )

  StartPipeline:
    Type: Custom::StartPipeline
    DependsOn: [ConfigParameter, StripeSecret, UaaSecret, SsoSecretValue]
    Properties:
      ServiceToken: !GetAtt PipelineStarterFunction.Arn

  # --- chaining: each stage starts the next only when it succeeds -------------

  PipelineChainRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-next
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: codebuild:StartBuild
                Resource:
                  - !GetAtt ImageBuildProject.Arn
                  - !GetAtt EnvProject.Arn

  PrereqSucceededRule:
    Type: AWS::Events::Rule
    Properties:
      Description: prereq succeeded -> build images
      EventPattern:
        source: [aws.codebuild]
        detail-type: ["CodeBuild Build State Change"]
        detail:
          build-status: [SUCCEEDED]
          project-name: [!Ref PrereqProject]
      Targets:
        - Id: images
          Arn: !GetAtt ImageBuildProject.Arn
          RoleArn: !GetAtt PipelineChainRole.Arn

  ImagesSucceededRule:
    Type: AWS::Events::Rule
    Properties:
      Description: images pushed -> provision the environment
      EventPattern:
        source: [aws.codebuild]
        detail-type: ["CodeBuild Build State Change"]
        detail:
          build-status: [SUCCEEDED]
          project-name: [!Ref ImageBuildProject]
      Targets:
        - Id: apply
          Arn: !GetAtt EnvProject.Arn
          RoleArn: !GetAtt PipelineChainRole.Arn

  # The hand-started native build ends the same way: the environment is re-applied, and
  # below the protected flavours every apply redeploys, so the tasks pull what was pushed.
  NativeImagesSucceededRule:
    Type: AWS::Events::Rule
    Properties:
      Description: native images pushed -> provision the environment
      EventPattern:
        source: [aws.codebuild]
        detail-type: ["CodeBuild Build State Change"]
        detail:
          build-status: [SUCCEEDED]
          project-name: [!Ref NativeImageBuildProject]
      Targets:
        - Id: apply
          Arn: !GetAtt EnvProject.Arn
          RoleArn: !GetAtt PipelineChainRole.Arn

Outputs:
  ProjectId:
    Description: Use this same id for every environment in this account
    Value: !Ref ProjectId
    Export:
      Name: !Sub "${AWS::StackName}-ProjectId"

  Environment:
    Value: !Ref EnvName

  Flavour:
    Value: !Ref Flavour

  StateBucket:
    Value: !Ref TerraformStateBucket

  Registry:
    Description: REGISTRY for the application's own publish workflow
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectId}"

  NativeImageProject:
    Description: Start this CodeBuild project to build native images and re-apply; 2-images builds the default JVM ones
    Value: !Ref NativeImageBuildProject

  ConfigParameterName:
    Description: Where the app's publish workflow reads the project id from
    Value: !Ref ConfigParameter

  HibernateProject:
    Description: Run this to put the environment to sleep
    Value: !Ref HibernateProject

  WakeProject:
    Description: Run this to bring it back
    Value: !Ref WakeProject

  PipelineConsole:
    Description: Watch the three stages here
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codebuild/projects?region=${AWS::Region}"

  StripeWebhookPath:
    Description: The path billing actually serves
    Value: /billing/api/v1/stripe-webhook/public/events
    Condition: HasStripeKey
