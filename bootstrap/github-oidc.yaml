AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Lets this repository's GitHub Actions workflows assume AWS roles without any stored
  credentials. Creates the GitHub OIDC identity provider and two narrowly scoped roles:
  one that publishes the bootstrap template to S3 from the trunk branch, and one that
  runs terraform plan on pull requests. Deploy this once per AWS account.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Repository }
        Parameters: [GithubAccount, PlatformRepo, Branch]
      - Label: { default: Template publishing }
        Parameters: [TemplateBucket]
      - Label: { default: Plan role }
        Parameters: [ProjectId, CreateOidcProvider]
    ParameterLabels:
      CreateOidcProvider: { default: Create the OIDC provider }
      TemplateBucket: { default: Bucket serving the launch template }

Parameters:
  GithubAccount:
    Type: String
    Default: cvhome-saas

  PlatformRepo:
    Type: String
    Default: cvhome-platform

  Branch:
    Type: String
    Default: main
    Description: Only this branch may publish the launch template.

  TemplateBucket:
    Type: String
    Default: cvhome-saas
    Description: >-
      Bucket the one-click launch template is published to. The publish role gets write
      access to the platform/ prefix in this bucket and nothing else.

  ProjectId:
    Type: String
    Default: cvhome
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,17}$"
    Description: Used to scope the plan role to this project's SSM parameters and state.

  CreateOidcProvider:
    Type: String
    Default: "yes"
    AllowedValues: ["yes", "no"]
    Description: >-
      An AWS account can hold only one identity provider per URL. Choose no if another
      stack already registered token.actions.githubusercontent.com.

Conditions:
  ShouldCreateProvider: !Equals [!Ref CreateOidcProvider, "yes"]

Resources:
  GithubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # IAM validates this provider against its own trusted CAs and no longer relies on
      # the thumbprint, but the property is still accepted and harmless.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  # --------------------------------------------------------------------------
  # Publishing the launch template.
  #
  # Trust is pinned to one branch. A workflow on any other branch, or on a pull
  # request from a fork, cannot assume this role, so it cannot replace the template
  # behind the one-click Launch Stack button.
  # --------------------------------------------------------------------------

  TemplatePublishRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${PlatformRepo}-template-publish"
      Description: Publishes the bootstrap template to S3 from GitHub Actions
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GithubAccount}/${PlatformRepo}:ref:refs/heads/${Branch}"
      Policies:
        - PolicyName: publish-template
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteTheLaunchTemplate
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                Resource: !Sub "arn:aws:s3:::${TemplateBucket}/platform/*"

  # --------------------------------------------------------------------------
  # terraform plan on pull requests.
  #
  # Read-only by construction: an explicit list rather than the ReadOnlyAccess managed
  # policy, whose contents change under you and reach further than a plan needs. The
  # plan runs with -lock=false, so it needs no write access to state either.
  # --------------------------------------------------------------------------

  PlanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${PlatformRepo}-plan"
      Description: Runs terraform plan on pull requests from GitHub Actions
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GithubAccount}/${PlatformRepo}:pull_request"
      Policies:
        - PolicyName: read-everything-a-plan-refreshes
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DescribeInfrastructure
                Effect: Allow
                Action:
                  - ec2:Describe*
                  - ecs:Describe*
                  - ecs:List*
                  - elasticloadbalancing:Describe*
                  - rds:Describe*
                  - rds:ListTagsForResource
                  - route53:Get*
                  - route53:List*
                  - acm:Describe*
                  - acm:List*
                  - cloudfront:Get*
                  - cloudfront:List*
                  - servicediscovery:Get*
                  - servicediscovery:List*
                  - application-autoscaling:Describe*
                  - logs:Describe*
                  - logs:ListTagsForResource
                  - iam:Get*
                  - iam:List*
                  - s3:GetBucket*
                  - s3:ListBucket
                  - s3:GetLifecycleConfiguration
                  - s3:GetEncryptionConfiguration
                  - ecr:Describe*
                  - ecr:ListTagsForResource
                  - sts:GetCallerIdentity
                Resource: "*"

              # Describe, deliberately not GetSecretValue. A plan needs the ARN of a
              # secret, never its contents.
              - Sid: DescribeSecrets
                Effect: Allow
                Action: secretsmanager:DescribeSecret
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${ProjectId}/*"

              - Sid: ReadEnvironmentConfig
                Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectId}/*"

              - Sid: ReadTerraformState
                Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !Sub "arn:aws:s3:::${ProjectId}-*-tfstate-${AWS::AccountId}-${AWS::Region}"
                  - !Sub "arn:aws:s3:::${ProjectId}-*-tfstate-${AWS::AccountId}-${AWS::Region}/*"

Outputs:
  TemplatePublishRoleArn:
    Description: Set as the AWS_TEMPLATE_PUBLISH_ROLE_ARN repository secret
    Value: !GetAtt TemplatePublishRole.Arn

  PlanRoleArn:
    Description: Set as the AWS_PLAN_ROLE_ARN repository secret
    Value: !GetAtt PlanRole.Arn

  NextStep:
    Description: What to do with the two ARNs above
    Value: !Sub >-
      Add them as repository secrets on ${GithubAccount}/${PlatformRepo}:
      AWS_TEMPLATE_PUBLISH_ROLE_ARN and AWS_PLAN_ROLE_ARN.
